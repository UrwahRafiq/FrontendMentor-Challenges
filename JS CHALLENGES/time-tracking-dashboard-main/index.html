<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<script defer src="./app.js"></script>

<link rel="stylesheet" href="./output.css">
</head>
<body class="md:flex h-screen md:items-center md:justify-center font-rubik bg-fem-navy-950 text-white text-lg">
  <div id="dashboard" class="container w-[85%] h-auto lg:h-auto md:h-[100%] xl:w-8/12 mx-auto grid lg:grid-cols-[0.30fr_1fr] md:grid-rows-[0.2fr_1fr] lg:grid-rows-1 gap-6 2xl:w-1/3 py-8 lg:py-0">
    <div class="h-full md:min-h-[150px] bg-fem-navy-900 rounded-xl overflow-hidden md:flex lg:flex lg:flex-col">
      <div id="avatar" class="bg-fem-purple-600 p-6 rounded-xl flex flex-row justify-around md:justify-center md:items-center lg:flex-col md:items-start md:justify-start gap-6 md:w-[70%] lg:w-full lg:flex-col lg:items-start">
        <img src="./images/image-jeremy.png" alt="avatar" class="w-16 h-16 border-[2.5px] border-white rounded-full">
        <div class="md:flex md:items-start md:flex-col md:justify-center">
          <span class="text-xs text-fem-navy-200">Report for</span>
          <h1 class="text-2xl md:text-3xl font-thin lg:mb-8 md:mb-0">Jeremy Robson</h1>
        </div>
      </div>
      <ul class="p-6 flex md:flex-col flex-row items-center justify-evenly md:items-start md:justify-center gap-4 text-md md:text-sm text-fem-navy-200 md:w-[30%]">
        <li class="hover:text-white"><button class="buttons" category="daily">Daily</button></li>
        <li class="hover:text-white active"><button class="buttons" category="weekly">Weekly</button></li>
        <li class="hover:text-white"><button class="buttons" category="monthly">Monthly</button></li>
      </ul>
    </div>
    <div id="cards" class="grid grid-cols-1 lg:grid-cols-3 lg:grid-rows-2 gap-6 md:grid-cols-2 lg:h-full"></div>
  </div>
</body>
</html>
